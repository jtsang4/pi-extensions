name: Verify

on:
  push:
    branches: [main]
    # Keep package skills covered; only repository documentation/instructions skip CI.
    paths-ignore:
      - '*.md'
      - 'extensions/**/*.md'
      - 'tests/**/*.md'
      - 'docs/**'
      - '.agents/**'
      - '.claude/**'
      - 'claude/**'
      - LICENSE
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'extensions/**/*.md'
      - 'tests/**/*.md'
      - 'docs/**'
      - '.agents/**'
      - '.claude/**'
      - 'claude/**'
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: false

      - name: Prepare E2E evidence directory
        run: |
          mkdir -p "$RUNNER_TEMP/subagent-e2e"
          echo "TMPDIR=$RUNNER_TEMP/subagent-e2e" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm test:subagent:e2e

      - name: Preserve deterministic E2E evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: subagent-e2e-node-${{ matrix.node }}
          path: ${{ runner.temp }}/subagent-e2e
          include-hidden-files: true
          retention-days: 7
